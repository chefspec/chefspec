name: Feature Request
description: Suggest a new matcher, feature, or improvement for ChefSpec
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an improvement to ChefSpec!

        Before opening a new issue, please search the
        [existing issues](https://github.com/chef/chefspec/issues) to see if it
        has already been requested.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case this feature would address.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: >-
        How would you like this to work? Include example spec syntax if
        you're proposing a new matcher.
      render: ruby
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you've tried.
    validations:
      required: false
